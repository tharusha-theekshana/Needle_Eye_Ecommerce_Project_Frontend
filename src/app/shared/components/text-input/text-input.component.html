<div class="app-field" [class.has-error]="errorMessage">
  <label *ngIf="label" [for]="inputId" class="app-field-label">{{ label }}</label>

  <div class="app-field-control">
    <i *ngIf="icon" class="bi {{ icon }} field-icon"></i>

    <input
      [id]="inputId"
      class="app-field-input"
      [class.has-icon]="icon"
      [type]="inputType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [attr.autocomplete]="autocomplete"
      [attr.maxlength]="maxlength"
      [attr.minlength]="minlength"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <button
      *ngIf="type === 'password'"
      type="button"
      class="toggle-visibility"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
      <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
    </button>
  </div>

  <span class="app-field-error" *ngIf="errorMessage">{{ errorMessage }}</span>
</div>
