<div class="d-flex flex-column flex-lg-row overflow-hidden auth-content">
  <div class="col-lg-6 auth-image-content d-none d-lg-block">
    <img class="img" src="/images/login-banner-image.png">
  </div>

  <div class="col-lg-6 d-flex flex-column align-items-center px-2 px-sm-0 px-md-5 px-sm-0 py-3 py-sm-0 form-content">
    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 w-100">
      <a class="brand-mark-auth pb-lg-5 pb-md-5 pb-0 text-start" routerLink="/">{{ brandName }}</a>
      <div class="w-100 form-inner">

        <p class="sub-title text-start text-nowrap mb-2">Last step</p>
        <h2 class="mb-1 sign-in-text">Reset Password</h2>
        <p class="mb-4 sub-text">Choose a new password for your account.</p>

        <form (ngSubmit)="onSubmit()">
          <app-text-input
            label="New password"
            type="password"
            icon="bi-lock"
            placeholder="••••••••"
            [maxlength]="20"
            [minlength]="8"
            [(ngModel)]="newPassword"
            [ngModelOptions]="{standalone: true}"
            [errorMessage]="newPasswordError"
          ></app-text-input>

          <app-text-input
            label="Confirm new password"
            type="password"
            icon="bi-lock"
            placeholder="••••••••"
            [maxlength]="20"
            [minlength]="8"
            [(ngModel)]="confirmPassword"
            [ngModelOptions]="{standalone: true}"
            [errorMessage]="confirmPasswordError"
          ></app-text-input>

          <button type="submit" class="btn-fill w-100 app-button" [disabled]="submitting">
            {{ submitting ? 'RESETTING' : 'RESET PASSWORD' }}
          </button>
        </form>

        <hr class="stitch my-4">

        <app-alert-message
          [errorMessage]="errorMessage"
          (closed)="errorMessage = ''"
        ></app-alert-message>

        <p class="text-center switch-text">
          Remembered your password?
          <a routerLink="/login" class="switch-link">Sign in</a>
        </p>
      </div>
    </div>

    <p class="login-footer text-center mb-3">
      &copy; {{ currentYear }} {{ brandName }}. All rights reserved.
    </p>
  </div>
</div>
